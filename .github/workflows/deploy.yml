name: Deploy HCM202 to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Quyền hạn cho phép triển khai lên GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Giới hạn 1 deployment tại một thời điểm
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production application
        env:
          REACT_APP_GOOGLE_SHEET_WEBAPP_URL: ${{ secrets.REACT_APP_GOOGLE_SHEET_WEBAPP_URL }}
          CI: false
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
