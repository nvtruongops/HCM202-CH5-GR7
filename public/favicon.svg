<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="redGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#E53935" />
      <stop offset="70%" stop-color="#C62828" />
      <stop offset="100%" stop-color="#8E0000" />
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#FFD700" flood-opacity="0.8"/>
    </filter>
    <linearGradient id="goldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>
  </defs>

  <!-- Outer Ring Shadow -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="rgba(255, 215, 0, 0.25)" stroke-width="4" />

  <!-- Main Red Background Circle -->
  <circle cx="50" cy="50" r="45" fill="url(#redGrad)" stroke="url(#goldBorderGrad)" stroke-width="4.5" />

  <!-- Golden 5-Pointed Star -->
  <polygon
    points="50,18 57.5,37 77.5,37.5 61.5,49.5 67.5,69 50,57.5 32.5,69 38.5,49.5 22.5,37.5 42.5,37"
    fill="#FFD700"
    stroke="#FFF59D"
    stroke-width="0.8"
    filter="url(#goldGlow)"
  />
</svg>
